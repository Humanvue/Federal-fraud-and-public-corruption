name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate data
        run: npm run validate
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Generated JSON Schema is up to date
        run: npm run schema && git diff --exit-code -- schemas
      - name: Build site and search index
        run: npm run build
      - name: Check downloads
        run: npm run check:downloads
