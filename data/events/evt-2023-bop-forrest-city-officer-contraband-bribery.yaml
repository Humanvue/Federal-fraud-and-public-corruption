summary: |
  Robert Cochran worked as a correctional officer at the Federal Correctional Complex Forrest City in Arkansas, a Federal Bureau of Prisons facility. According to a one-count indictment returned in the Eastern District of Arkansas on December 5, 2023, from on or about October 1, 2022, through on or about February 27, 2023, Cochran corruptly agreed to receive and accept money in exchange for smuggling contraband into the prison. According to the U.S. Attorney's Office for the Eastern District of Arkansas, an investigation found that he received approximately $58,775 from friends and family of inmates to bring contraband into the facility, including rolling papers, tobacco, sunglasses and over-the-counter drugs. The office states that video footage from February 2023 showed him leaving bags containing contraband in an office while on duty, after which an inmate would enter to retrieve the items, and that Cochran later admitted he was paid to bring items into the prison for inmates. The Department of Justice Office of the Inspector General and the Federal Bureau of Prisons investigated the case.
