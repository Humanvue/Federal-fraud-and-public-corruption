jurisdiction_note: Prosecuted jointly by the Criminal Division's Public Integrity Section and the U.S. Attorney's Office for the Middle District of Florida. Carla Wiley pleaded guilty on March 3, 2016, before the July 2016 indictment of Brown and Simmons; that plea is treated as the first public action.
summary: |
  According to the indictment returned on July 8, 2016, U.S. Representative Corrine Brown and her chief of staff, Elias "Ronnie" Simmons, solicited more than $800,000 in donations between late 2012 and early 2016 to One Door for Education – Amy Anderson Scholarship Fund, whose president was Carla Wiley, by representing that the money would fund scholarships and school computer drives, while using most of it for personal and professional benefit; the indictment states that One Door was associated with only two scholarships totaling $1,200. Simmons was also charged with diverting over $80,000 of a relative's U.S. House salary. At the December 2017 sentencing the court ordered Brown and Wiley to forfeit $654,292.39 and Simmons to forfeit $727,964.90, total restitution of $452,515.87 to fraud victims, $62,650.99 from Brown to the IRS and $91,621.38 from Simmons to the U.S. House of Representatives. After the Eleventh Circuit, sitting en banc, vacated Brown's convictions and sentence in May 2021 and remanded for a new trial, Brown entered a 2022 plea agreement stating that between 2009 and 2015 she caused tax returns to be filed that omitted income from cash deposits and over-reported charitable giving; the court ordered $62,650.99 in restitution to the IRS.
