summary: |
  The U.S. Office of Special Counsel (OSC) issued two reports on Hatch Act complaints against Counselor to the President Kellyanne Conway, a commissioned officer in the White House Office who held that position since January 20, 2017. In a report dated March 6, 2018 (OSC File No. HA-18-0966), OSC found that Ms. Conway violated the Hatch Act on two separate occasions, during a November 20, 2017 Fox & Friends interview and a CNN New Day interview, by advocating for and against candidates in the December 2017 Alabama special election for U.S. Senate while appearing in her official capacity, and referred the violations to the President for appropriate discipline. In a second report (OSC File Nos. HA-19-0631 and HA-19-3395) sent to the President on June 13, 2019, OSC concluded that, beginning in February 2019, Ms. Conway engaged in a pattern of partisan attacks on Democratic Party presidential candidates during official media appearances and on her Twitter account, which OSC determined she used to execute official duties; OSC's investigation identified at least 10 such interviews. Citing her prior violation and her public statements about the Act, OSC recommended that the President remove her from federal service.
