summary: |
  Angela Crosland worked as a correctional officer at Federal Correctional Institution Williamsburg in Salters, South Carolina, a Federal Bureau of Prisons facility. According to a federal indictment returned in the District of South Carolina on November 14, 2023, from about September 2021 through about June 2022 Crosland accepted money in exchange for smuggling contraband, including methamphetamine and suboxone, into the prison for inmates, and conducted financial transactions designed to conceal the source of those payments. The indictment included a forfeiture provision for $56,791, described as the total of the bribery payments. According to the U.S. Attorney's Office for the District of South Carolina, evidence presented to the jury at a two-day trial included Cash App account records reflecting payments to her account totaling $56,791 from family and associates of inmates over approximately nine months, and showed that the contraband included suboxone, methamphetamine, K-2-soaked paper, marijuana, tobacco, food, and other items, and that she did not report the income on her federal tax returns. The court ordered her to pay $18,649.00 to the Internal Revenue Service for filing false tax returns. The Department of Justice Office of the Inspector General and IRS Criminal Investigation investigated the case.
