summary: |
  In March 2017 a federal grand jury in San Diego indicted nine members of the U.S. Navy's Seventh Fleet (a rear admiral, four captains, a Marine Corps colonel, two commanders and a chief warrant officer) for conspiring with Leonard Glenn Francis, owner and chief executive of the Singapore ship-husbanding contractor Glenn Defense Marine Asia (GDMA), and for receiving bribes from him. According to the plea agreements described in U.S. Attorney's Office releases, the officers accepted dinners, hotel stays, entertainment and the services of prostitutes between 2006 and 2008 and, in return, steered ships to ports GDMA serviced, shared confidential and classified ship schedules, and advocated for GDMA before other Navy officials. Commander Stephen Shedd's plea agreement states that the nine officers collectively received more than $250,000 in things of value. Francis admitted in his 2015 plea agreement that GDMA overbilled the Navy for goods and services; at his November 2024 sentencing the court ordered $20 million in restitution to the Navy, a $150,000 fine and forfeiture of $35 million, and GDMA was ordered to pay a $36 million fine. The case was investigated by the Defense Criminal Investigative Service, the Naval Criminal Investigative Service and the Defense Contract Audit Agency.
