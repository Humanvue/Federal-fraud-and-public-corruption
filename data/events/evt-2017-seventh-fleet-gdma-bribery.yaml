    status_history:
      - track: criminal
        status: pleaded_guilty
        date: 2015
        source_ids:
          - src-usao-sdca-20241105-01
        note: "First guilty plea, concerning bribery and fraud, per the 2024 sentencing release; the 2015 plea release itself was not fetched, so the day is not recorded. Charges: conspiracy to commit bribery (18 U.S.C. § 371), bribery (§ 201), conspiracy to defraud the United States (§ 371). Arrested in San Diego 2013-09-16."
      - track: criminal
        status: fugitive
        date: 2022-09-04
        source_ids:
          - src-usao-sdca-20241105-01
        note: Cut off his GPS monitor while on house arrest and fled to Mexico, Cuba and Venezuela before his September 2022 sentencing; arrested in Venezuela and returned to the U.S. 2023-12-20.
      - track: criminal
        status: pleaded_guilty
        date: 2024-11-05
        source_ids:
          - src-usao-sdca-20241105-01
        note: "Second plea agreement: failure to appear, 18 U.S.C. § 3146."
      - track: criminal
        status: sentenced
        date: 2024-11-05
        source_ids:
          - src-usao-sdca-20241105-01
        note: 180 months (164 months for bribery and fraud plus 16 months for failure to appear, consecutive); $20 million restitution to the Navy; $150,000 fine; $35 million forfeiture. Case numbers 13-CR-3781, 3782 and 4287.
