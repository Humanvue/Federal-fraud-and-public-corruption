jurisdiction_note: House Committee on Ethics matter only; no criminal or civil case. The dates of the Office of Congressional Ethics referrals and the period of the underlying conduct are not on a fetched government page.
summary: |
  On July 30, 2020, the Chairman and Ranking Member of the House Committee on Ethics submitted a report to the House in the Matter of Allegations Relating to Representative David Schweikert. The Committee's statement says its Investigative Subcommittee unanimously concluded that there was substantial reason to believe that Representative Schweikert violated House Rules, the Code of Ethics for Government Service, federal laws and other applicable standards in connection with campaign finance violations and reporting errors by his authorized campaign committees, the misuse of his Members' Representational Allowance for unofficial purposes, pressuring official staff to perform campaign work, and his lack of candor and due diligence during the investigation. As part of a negotiated resolution, Schweikert agreed to admit to all eleven counts in the Statement of Alleged Violations adopted by the subcommittee, to accept a sanction of reprimand and a $50,000 fine, and to waive further procedural rights. On July 29, 2020, the full Committee unanimously accepted the subcommittee's recommendations. The govinfo bill status record shows that H.Res. 1074, adopting the Committee report, was agreed to by the House by voice vote on July 31, 2020.
