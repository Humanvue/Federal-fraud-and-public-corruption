prosecuting_office: null
court_cases: []
jurisdiction_note: null
summary: |
  The Department of Veterans Affairs Office of Inspector General (OIG) investigated an anonymous complaint alleging that Secretary of Veterans Affairs David Shulkin and other senior leaders misused VA funds by taking an official July 2017 trip to Europe for more personal than official activities. The 11-day trip to Copenhagen and London included three-and-a-half days of official events, with a cost to VA of at least $122,334; the delegation included the Secretary's wife, Dr. Merle Bari, and VA Chief of Staff Vivieca Wright Simpson. OIG found that the Chief of Staff's alteration of a document and misrepresentations to ethics officials caused Dr. Bari to be approved as an "invitational traveler," which authorized VA to pay her travel costs; that Secretary Shulkin improperly accepted a gift of Wimbledon tickets and related hospitality; that a VA employee's time was misused as a personal travel concierge to plan tourist activities; and that travelers' documentation was inadequate to determine the trip's full cost. In Report No. 17-05909-106, issued February 14, 2018, OIG made five recommendations, including that Secretary Shulkin reimburse the $4,312 VA paid for Dr. Bari's travel and reimburse the value of the Wimbledon tickets and related hospitality.
