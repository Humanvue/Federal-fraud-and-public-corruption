id: evt-2018-va-secretary-europe-travel
title: VA Secretary found to have improperly accepted a gift, and chief of staff found to have altered a record, in connection with Europe trip
categories:
  - conflict_of_interest_ethics
  - false_statements_obstruction
agencies:
