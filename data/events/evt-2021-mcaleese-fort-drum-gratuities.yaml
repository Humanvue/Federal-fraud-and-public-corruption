summary: |
  Cindy McAleese, a civilian contracting officer for the U.S. Army at Fort Drum, New York, since 2012, was arraigned on December 22, 2021 on a one-count indictment charging conspiracy to commit an offense against the United States by seeking and accepting gratuities. The indictment alleges that she sought and received sports tickets, meals, sexual encounters, and time and attention from local general contractor Sean O'Sullivan in exchange for official action, such as giving his company government contracts and approving payment on them, and that the two kept their relationship secret from other Fort Drum officials. O'Sullivan admitted in his plea that the conduct ran from November 2009 through February 2018. According to court filings described by the Department of Transportation Inspector General, the official acts included recommending that certain Army contracts be 100 percent set aside for Service-Disabled Veteran-Owned Small Businesses, accepting work by O'Sullivan's company, Sierra Delta Contracting LLC, to facilitate payment, and helping it win more contracts. O'Sullivan, Sierra Delta and SOS Inc. agreed to pay $690,542.68 to resolve civil False Claims Act allegations over set-aside contracts Sierra Delta was not eligible for, which earned it more than $3.3 million; the court ordered O'Sullivan to pay $345,271.34 restitution.
