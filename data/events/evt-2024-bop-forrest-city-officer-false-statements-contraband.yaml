summary: |
  Tejuana Dillard was employed for 13 years, between 2008 and July 2021, as a correctional officer at the Federal Correctional Complex Forrest City in Arkansas, a Federal Bureau of Prisons facility. According to a two-count indictment returned in the Eastern District of Arkansas in June 2024, on or about June 8, 2020, Dillard accepted U.S. currency in return for providing tobacco to an inmate of a federal prison, and on or about August 4, 2021, she made false statements in connection with the investigation by stating she did not know why an individual had sent her money. According to the U.S. Attorney's Office for the Eastern District of Arkansas, an investigation determined that she smuggled contraband cigarettes into the prison throughout 2020 and received a total of $91,788 to provide the cigarettes to two inmates, who sold them to other inmates. The office states that in an interview with federal agents she admitted smuggling cigarettes but said she had done so only "a couple of times," and that she knew those statements were false when she made them. The Department of Justice Office of the Inspector General and the Federal Bureau of Prisons investigated the case.
