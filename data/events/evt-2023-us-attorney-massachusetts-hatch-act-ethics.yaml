summary: |
  The Department of Justice Office of the Inspector General (OIG) and the U.S. Office of Special Counsel (OSC) each issued reports on May 17, 2023 concerning Rachael Rollins, sworn in as U.S. Attorney for the District of Massachusetts on January 10, 2022. OIG (Report 23-071) concluded that Rollins used her position and non-public DOJ information to influence the outcome of the 2022 Democratic primary for Suffolk County District Attorney, in violation of Sections 2635.702 and 2635.703; knowingly and willfully made a false statement of material fact during her OIG interview, in violation of 18 U.S.C. § 1001; lacked candor during that interview; actively participated in a partisan political campaign; and attended a July 14, 2022 Democratic Party fundraiser without approval from the Deputy Attorney General. OIG referred the false-statement allegation to the Department on December 16, 2022; on January 6, 2023 the Department informed OIG that it declined prosecution. OSC (File No. HA-22-000173) concluded that Rollins violated the Hatch Act by leaking non-public DOJ information so that news outlets would report that a candidate she opposed faced a potential DOJ investigation, and by attending the fundraiser while on duty, in her official capacity, and using a government-owned vehicle.
