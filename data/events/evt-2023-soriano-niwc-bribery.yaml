summary: |
  James Soriano worked for the Naval Information Warfare Center in San Diego from 2006 to 2019 as an engineer, project leader and certified Contracting Officer Representative. A grand jury indicted him with Philip Flores and Intellipeak Solutions, Inc. in November 2023, and with Russell Thurston of Cambridge International Systems, Inc. in an indictment unsealed March 7, 2024. According to Soriano's plea agreement as described by the U.S. Attorney's Office, from approximately June 2014 through at least October 2019 the contractors gave him meals, tickets to the 2018 MLB All-Star Game, the 2018 World Series and the 2019 Super Bowl, and jobs for family and friends, including a friend who gave Soriano $2,000 a month from her salary. In return Soriano let the contractors draft procurement documents, submitted them in competitive and non-competitive procurements, and advocated for their selection. Cambridge's plea agreement states the government obligated more than $32 million on one task order and over $100 million on the other; Flores's plea agreement states the government paid Intellipeak more than $16 million on approximately 26 contracts and task orders. The court ordered Soriano to forfeit $209,527.51 and pay $18,722.40 in restitution to the IRS for a false 2018 tax return.
