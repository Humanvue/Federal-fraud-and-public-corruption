summary: |
  Leonard Darnell George was a U.S. Customs and Border Protection officer. According to an indictment unsealed in the Southern District of California on July 3, 2023, George demanded and accepted items of value in return for permitting vehicles carrying narcotics to enter the United States, and he, Mario Angel Gutierrez, and Esteban Galvan coordinated the smuggling of methamphetamine, fentanyl, cocaine, and heroin from Mexico. According to the U.S. Attorney's Office, witnesses at trial testified that George agreed in late 2021 to let drug-laden vehicles through his inspection lane and would tell a drug trafficking organization when he was at work and which lane he was on. In February 2022, after a law enforcement alert flagged one vehicle, George sent it to secondary inspection, where approximately 222 pounds of methamphetamine was found, and let the vehicle behind it enter with over 200 pounds of drugs. Text messages showed he received approximately $13,000 for that vehicle, agreed to $17,000 per vehicle, and received $68,000 for four vehicles in June 2022. Homeland Security Investigations, the FBI, the DHS Office of Inspector General, and CBP's Office of Professional Responsibility investigated.
