summary: |
  Evester Edd was a senior human resources employee at the Peace Corps. A criminal complaint announced by the U.S. Attorney's Office for the District of Maryland on July 2, 2025, charged Edd with wire fraud, theft of government funds, and making false statements to federal agents; the supporting affidavit alleged that he worked simultaneously as a federal employee and a federal contractor and falsified timecards submitted to multiple federal agencies. According to court documents described by the U.S. Attorney's Office, from September 2024 through November 2024 Edd recorded work hours in the Peace Corps time-and-attendance system that he did not work, and the Peace Corps paid him for those hours. Investigators found that on a nearly daily basis he signed on from his residence to work for the Nuclear Regulatory Commission during his Peace Corps work hours. Edd retired from federal service in December 2024. Chief Magistrate Judge Timothy J. Sullivan ordered two years of supervised probation, including three months of home confinement, $20,758.50 in restitution, and 250 hours of community service. The Peace Corps Office of Inspector General led the investigation with the Federal Housing Finance Agency and Nuclear Regulatory Commission inspectors general.
