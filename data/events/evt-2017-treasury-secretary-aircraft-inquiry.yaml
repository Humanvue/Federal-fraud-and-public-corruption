summary: |
  After media and public inquiries about Secretary of the Treasury Steven T. Mnuchin's use of a government aircraft on August 21, 2017 for a trip to the Mint's Bullion Depository in Kentucky, the Treasury Inspector General tasked the Office of Inspector General's Counsel, Rich Delmar, with an inquiry into the trip's planning and justification. In a memorandum to the Inspector General dated October 4, 2017, Counsel reported that nine requests for government aircraft had been made on behalf of the Secretary: seven resulted in military aircraft, one was for a trip planned for later that month, and one (the "honeymoon trip") was withdrawn. The Assistant Secretary for Management advised that no chartered private air transport at government expense had occurred. The memorandum states, "I see no violation of law in these requests and uses," because approval from White House officials designating the trips as White House Support Missions placed them outside OMB Directive A-126 and the Federal Travel Regulation. It also describes a disconnect between the standard of proof called for in the applicable White House memorandum and the amount of proof provided by Treasury in justifying the trip requests.
