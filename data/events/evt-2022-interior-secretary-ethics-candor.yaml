summary: |
  The Department of the Interior Office of Inspector General (OIG) issued two reports concerning former Secretary of the Interior Ryan Zinke, confirmed March 1, 2017, whose resignation was effective January 2, 2019. In Report No. 18-0890, published February 16, 2022, OIG investigated allegations that Secretary Zinke remained involved in a land development project in Whitefish, Montana, involving the Great Northern Veterans Peace Park Foundation's land. OIG found that he failed to abide by his ethics obligations not to manage or provide services to the Foundation, did not comply with his duty of candor when questioned by the Designated Agency Ethics Official, and misused his official position by directing subordinates to assist with Foundation matters. OIG did not find that he violated 18 U.S.C. § 208 or took official action to benefit the Halliburton Company. In Report No. 18-0480, published August 24, 2022, concerning a Connecticut tribal casino decision, OIG found that Secretary Zinke and the Department's Chief of Staff made statements to OIG investigators with the intent to mislead them and did not comply with their duty of candor. OIG referred both matters to the Department of Justice, which declined prosecution in the summer of 2021.
