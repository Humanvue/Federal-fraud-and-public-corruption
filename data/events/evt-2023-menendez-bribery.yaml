jurisdiction_note: IRS-Criminal Investigation and the National Security Division's Counterintelligence and Export Control Section are credited with assistance. The bribe total is described only as 'hundreds of thousands of dollars' and is therefore not recorded as a figure. Fines imposed on Hana and Daibes are recorded on their sentencing entries; no fine is stated for Menendez.
summary: |
  According to the indictment unsealed on September 22, 2023, Robert Menendez, the senior U.S. Senator from New Jersey and Chairman of the Senate Foreign Relations Committee, and his wife Nadine Menendez accepted hundreds of thousands of dollars' worth of bribes between 2018 and 2022 from three New Jersey businessmen, Wael Hana, Fred Daibes and Jose Uribe, including gold bars, cash, a Mercedes-Benz convertible worth more than $60,000, approximately $23,000 in mortgage payments and three $10,000 checks for a low-or-no-show job. In exchange, the indictment alleged, Menendez pressured a U.S. Department of Agriculture official to protect a halal-certification monopoly that Egypt had granted to Hana's company, sought to influence a New Jersey state prosecution involving Uribe's associates, recommended a U.S. Attorney nominee he believed he could influence in a federal case against Daibes, and provided non-public information to Egyptian officials. The FBI's June 2022 search of the Menendez home found over $480,000 in cash and over one hundred thousand dollars' worth of gold bars. The sentencing release states that the court ordered forfeiture of $922,188.10 from Robert Menendez and fines of $1,250,000 against Hana and $1,750,000 against Daibes.
