jurisdiction_note: The 2024 District of Columbia indictment is known only from a House Judiciary Committee letter; its prosecuting office and docket are not on a fetched government page. The January 2025 dismissal reported in news is not on any government page read and is omitted. The $30,000 in conduit contributions is not a bribe or a government loss, so no money field is filled.
summary: |
  According to the indictment returned on October 19, 2021, Jeff Fortenberry, who represented Nebraska's 1st Congressional District in the U.S. House of Representatives, concealed material facts and made false statements to federal investigators examining illegal contributions to his 2016 re-election campaign. The indictment states that Gilbert Chagoury, a foreign national, arranged for $30,000 to be contributed through conduit donors at a 2016 Los Angeles fundraiser; Chagoury admitted in a 2019 deferred prosecution agreement to providing approximately $180,000 for illegal contributions to four candidates and paid a $1.8 million fine. In a June 2018 call, the fundraiser's co-host told Fortenberry that the money probably came from Chagoury; Fortenberry did not file an amended FEC report and, in interviews on March 23, 2019 and July 18, 2019, denied knowledge of the contributions. The Ninth Circuit held in December 2023 that venue for the false-statement counts did not lie in the Central District of California because the statements were made in Nebraska and Washington, D.C. The House Committee on Ethics established an investigative subcommittee on November 17, 2021, deferred action at the Department of Justice's request, and closed the matter on April 1, 2022 after Fortenberry resigned effective March 31, 2022.
