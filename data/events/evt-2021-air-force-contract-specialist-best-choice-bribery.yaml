summary: |
  Brian Lowell Nash II was an enlisted contract specialist in the U.S. Air Force assigned to Joint Base Elmendorf-Richardson (JBER) in Alaska. According to a 26-count indictment announced in March 2021 by the U.S. Attorney's Office for the District of Alaska, Ryan Dalbec and his wife, Raihana Nadem, owned and managed Best Choice Construction, LLC, a federal contractor. According to court documents, Nash agreed in 2019 to accept more than $460,000 in bribes from Dalbec and in exchange supplied confidential bidding information on over $8,250,000 in Department of Defense contracts at Eielson Air Force Base and JBER, which helped Best Choice win contracts including a $6,850,000 construction contract related to the F-35 program at Eielson. Nash had received approximately $47,000 when the scheme was discovered, and the proceeds were laundered through family members and third-party bank accounts. The court ordered Dalbec to pay $16,296.80 in restitution to Eielson Air Force Base. In a separate False Claims Act case, the office reports more than $1.3 million in civil damages and penalties, including treble damages, against Nash, Dalbec, Nadem and Best Choice. The FBI, the Air Force Office of Special Investigations and the Defense Criminal Investigative Service investigated.
