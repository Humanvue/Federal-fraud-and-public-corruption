summary: |
  Robert P. Burke, a four-star admiral who commanded U.S. Naval Forces Europe and Africa from 2020 to 2022, was indicted in the District of Columbia for conspiracy to commit bribery, bribery, performing acts affecting a personal financial interest and concealing material facts; the indictment was unsealed May 31, 2024. Yongchul "Charlie" Kim and Meghan Messenger, co-CEOs of a company the D.C. Circuit's opinion identifies as Next Jump, Inc., were charged with conspiracy and bribery. According to court documents and trial evidence described by the U.S. Attorney's Office, the company ran a workforce training pilot for a Navy component from August 2018 through July 2019; the Navy ended that contract in late 2019 and told the company not to contact Burke. At a July 2021 meeting in Washington, the defendants agreed that Burke would steer a contract to the company in exchange for future employment. In December 2021 Burke ordered his staff to award the company a $355,000 contract to train personnel under his command in Italy and Spain; in October 2022 he joined the company at a $500,000 starting salary with 100,000 stock options. The court ordered $322,850 in restitution and $86,748.08 in forfeiture. DCIS, NCIS and the FBI investigated.
