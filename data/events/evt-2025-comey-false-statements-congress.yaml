summary: |
  James B. Comey Jr., the former Director of the Federal Bureau of Investigation, was named in a two-count indictment returned by a federal grand jury in the Eastern District of Virginia on September 25, 2025. According to the announcement by the U.S. Attorney's Office for the Eastern District of Virginia, the indictment charges him with making a false statement and with obstruction relating to his oral testimony before the U.S. Senate Judiciary Committee on September 30, 2020. An opinion of the U.S. District Court for the Southern District of New York, issued in a separate civil case brought by his daughter, recites the docket history: the grand jury indicted him on one count of making false statements to Congress and one count of obstructing a congressional proceeding, and the opinion records the Eastern District of Virginia's November 24, 2025 ruling on the indictment, its stated ground concerning the authority of the person who appeared before the grand jury for the government, and the government's appeal docketed in the Fourth Circuit on December 22, 2025 (No. 25-4674). The same opinion states that President Trump fired Comey as FBI Director in 2017. No dollar figures appear in the government sources.
