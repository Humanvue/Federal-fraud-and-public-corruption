jurisdiction_note: Co-defendant Rodney Gemar was a Hammond, Louisiana, police officer serving as a DEA task force officer; two other local deputies serving as task force officers pleaded guilty in separate cases. All were prosecuted federally.
summary: |
  Chad Allan Scott was a Drug Enforcement Administration special agent in the New Orleans Division; Rodney P. Gemar was a DEA task force officer and Hammond, Louisiana, police officer. An indictment returned in the Eastern District of Louisiana on September 29, 2017, and unsealed on October 2, 2017, charged Scott with obstruction of justice, perjury, falsifying records, seeking and receiving an illegal gratuity, conversion of property, removing property to prevent seizure, and conspiracy, and charged Gemar with conversion, removal of property, and conspiracy. According to the evidence at the first trial, Scott directed a Houston drug trafficker to buy a Ford F-150 truck worth approximately $43,000 and forfeit it to him, falsified the seizure paperwork so the truck became his official vehicle, induced two traffickers to testify falsely at a January 2016 federal trial, and committed perjury. According to the evidence at the second trial, between 2009 and 2016 Scott and Gemar took money and property from arrestees, skimmed cash seizures, destroyed evidence after a co-conspirator's arrest in January 2016, and used approximately $4,800 in stolen money to pay the co-conspirator's attorney. The Louisiana State Police, FBI, DEA Office of Professional Responsibility, and DOJ Office of the Inspector General investigated.
