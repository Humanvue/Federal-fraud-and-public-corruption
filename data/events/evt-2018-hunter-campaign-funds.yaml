summary: |
  According to the indictment returned on August 21, 2018, U.S. Representative Duncan D. Hunter of California's 50th Congressional District and his wife, Margaret E. Hunter, converted more than $250,000 in campaign funds to pay for personal expenses between 2009 and 2016 and filed false campaign finance records with the Federal Election Commission that described the purchases as campaign travel, dinners with volunteers and other campaign activity. The plea agreement states that the Hunters illegally converted more than $150,000 in campaign funds from 2010 through 2016 and engaged in 30 or more illegal transactions using campaign funds for personal use, including $2,448.27 for a Las Vegas trip in August 2011 and more than $14,000 for a family trip to Italy in November 2015. The U.S. Attorney's Office for the Southern District of California stated that the Hunters overdrew their bank account more than 1,100 times over a seven-year period. The FBI's San Diego Division investigated; the U.S. Attorney's Office for the Southern District of California prosecuted with assistance from the Public Integrity Section.
