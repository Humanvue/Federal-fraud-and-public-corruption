jurisdiction_note: Prosecuted by the U.S. Attorney's Office for the Eastern District of New York with the Criminal Division's Public Integrity Section; the Nassau County District Attorney and the Department of Labor Office of Inspector General assisted. The House expulsion reported in news is not on a fetched government page and is omitted.
summary: |
  According to the indictment unsealed on May 10, 2023, George Santos, U.S. Representative for New York's Third Congressional District, operated a company through which two donors each transferred $25,000 in the belief that the money would support his campaign; the funds were moved to his personal accounts and spent on personal expenses. The indictment also alleged that from June 2020 to April 2021 Santos received more than $24,000 in unemployment insurance benefits while employed, and that he filed false financial disclosure statements with the House. The plea agreement states that during the 2022 election cycle Santos and his campaign treasurer, Nancy Marks, reported to the Federal Election Commission contributions from family members that were never made and a $500,000 loan from Santos when he had less than $8,000, in order to qualify for a national party committee program that required $250,000 raised in a single quarter. The House Committee on Ethics stated on November 16, 2023 that its investigative subcommittee found substantial evidence of false FEC reports, personal use of campaign funds and Ethics in Government Act violations, and referred the matter to the Department of Justice. The court ordered restitution of $373,749.97 and forfeiture of $205,002.97.
