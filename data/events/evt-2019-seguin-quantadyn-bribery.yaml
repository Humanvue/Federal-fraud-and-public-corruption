summary: |
  In October 2019 a federal grand jury in San Antonio indicted Keith Alan Seguin, a civilian employee of the 502 Trainer Development Squadron at Randolph Air Force Base, together with QuantaDyn Corporation, an Ashburn, Virginia software engineering company, its co-owner David Joseph Bolduc Jr., and Rubens Wilson Fiuza Lima, on charges of conspiracy to defraud the United States, conspiracy to commit wire fraud and conspiracy to commit money laundering. According to the indictment, from 2006 to 2018 Bolduc and QuantaDyn paid more than $2.3 million in bribes to Seguin, who used his position to steer contracts and subcontracts for aircraft and close-air-support training simulators to QuantaDyn, and part of the bribe money was laundered through Fiuza Lima's business, Impex, for a ten percent fee. Seguin admitted leaking confidential competitor proposals and government budget information to prime contractors and to QuantaDyn. The court later found that co-conspirators paid Seguin $2,375,725.26 and that the scheme involved $100 million in work on Air Force projects. QuantaDyn's $37,757,713.91 restitution obligation also resolved its civil False Claims Act liability, and its majority owner separately paid $500,000 to resolve his personal False Claims Act liability. Investigated by GSA OIG, IRS-CI, DCIS, Army CID and AFOSI.
