summary: |
  According to the indictment returned by a federal grand jury in Miami on November 19, 2025, U.S. Representative Sheila Cherfilus-McCormick and her brother, Edwin Cherfilus, worked through their family health-care company on a FEMA-funded COVID-19 vaccination staffing contract in 2021, and in July 2021 the company received an overpayment of $5 million in FEMA funds. The indictment alleges that the defendants conspired to steal the $5 million, routed it through multiple accounts to disguise its source, and used a substantial portion as candidate contributions to Cherfilus-McCormick's 2021 congressional campaign and for the defendants' personal benefit. It further alleges that Cherfilus-McCormick and Nadege Leblanc arranged additional contributions through straw donors, and that Cherfilus-McCormick and her tax preparer, David K. Spencer, conspired to file a false federal tax return that claimed political spending and personal expenses as business deductions and inflated charitable contributions. FBI Miami and IRS Criminal Investigation are investigating; the U.S. Attorney's Office for the Southern District of Florida and the Criminal Division are prosecuting.
