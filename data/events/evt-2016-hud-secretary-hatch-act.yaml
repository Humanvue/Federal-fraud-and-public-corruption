summary: |
  The U.S. Office of Special Counsel (OSC) investigated a complaint, received April 11, 2016, alleging that Secretary of Housing and Urban Development Julián Castro used his official authority or influence to affect the outcome of an election during an April 4, 2016 interview on Yahoo News. OSC concluded that Secretary Castro violated the Hatch Act, 5 U.S.C. § 7323(a)(1) and 5 C.F.R. § 734.302, by advocating for and against Presidential candidates while giving a media interview in his official capacity. According to the report, his statements mixed his personal political views with official agency business despite his efforts to clarify that some answers were being given in his personal capacity. OSC noted that Secretary Castro had received four Hatch Act briefings since July 2014, that he stated he believed at the time that his conduct was consistent with the Act, and that he expressed regret about his actions. The report, dated June 24, 2016, was forwarded to the President under 5 U.S.C. § 1215(b) on July 18, 2016, together with Secretary Castro's response, for appropriate action.
