jurisdiction_note: Prosecuted by the Criminal Division's Public Integrity Section with the National Security Division's Counterintelligence and Export Control Section. All money figures are alleged; no verdict or plea was entered before the December 2, 2025 pardons. Whether the indictment was dismissed after the pardons is not on a fetched government page.
summary: |
  According to the indictment unsealed on May 3, 2024 in the Southern District of Texas, U.S. Congressman Enrique Roberto "Henry" Cuellar and his wife, Imelda Cuellar, accepted approximately $600,000 in bribes between December 2014 and November 2021 from an oil and gas company owned and controlled by the Government of Azerbaijan and a bank headquartered in Mexico City. The indictment alleges that the payments were laundered under sham consulting contracts through front companies and middlemen into shell companies owned by Imelda Cuellar, who performed little or no legitimate work under the contracts, and that in exchange Congressman Cuellar agreed to use his office to influence U.S. foreign policy in favor of Azerbaijan and to influence legislative activity and pressure Executive Branch officials on measures beneficial to the bank. Each defendant was charged with two counts of conspiracy, two counts of bribery of a federal official, two counts of conspiracy to commit honest services wire fraud, two counts of acting as an agent of a foreign principal, one count of conspiracy to commit money laundering and five counts of money laundering.
