summary: |
  Amara Dukuly was an immigration officer with U.S. Citizenship and Immigration Services (USCIS). According to a criminal complaint announced by the U.S. Attorney's Office for the Eastern District of Pennsylvania on June 26, 2025, from approximately 2015 Dukuly used his status as a USCIS employee to obtain payments from individuals in exchange for promises to help them obtain adjustments to their immigration status, such as a green card, work authorization documents, or visas, although the scope of his job duties did not give him authority to do those things. According to the U.S. Attorney's Office, court filings state that on April 4, 2025, Dukuly received a $6,000 bribe from an individual to help with the removal of "terrorist" references from that individual's immigration file, and promised the individual that the file would then be "clean." The court filings describe the conduct as continuing until his arrest in June 2025. U.S. District Judge John Milton Younge ordered 12 months and one day in prison, three years of supervised release, a $6,000 fine, and $6,000 in restitution. The Department of Homeland Security Office of Inspector General, Homeland Security Investigations, and the FBI investigated.
