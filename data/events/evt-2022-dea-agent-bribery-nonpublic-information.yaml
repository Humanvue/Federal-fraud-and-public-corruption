summary: |
  John Costanzo Jr. was a Drug Enforcement Administration special agent assigned to DEA Headquarters and, until June 2019, a group supervisor in the Miami Field Office. Manuel Recio retired from the DEA as Assistant Special Agent in Charge of the Miami Field Office in November 2018 and then ran a business providing private investigative services to criminal defense attorneys and helping them recruit clients. According to an indictment unsealed in the Southern District of New York on May 20, 2022, and the trial evidence as described by prosecutors, from about October 2018 through about November 2019 Recio provided benefits to Costanzo in exchange for nonpublic DEA information, including the identities of individuals charged in sealed indictments, the anticipated timing of arrests, and intelligence from the NADDIS database. The benefits included a $2,500 payment in November 2018 routed through a company owned by a Costanzo family member, tens of thousands of dollars routed through a company created by a DEA task force officer, and $50,000 paid through a family member toward Costanzo's condominium purchase in January and February 2019. The court ordered Costanzo to forfeit $98,250. The FBI and the DOJ Office of the Inspector General investigated.
