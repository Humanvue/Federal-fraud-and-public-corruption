summary: |
  Lukman Owolabi Ganiyu was a Senior Immigration Services Officer with U.S. Citizenship and Immigration Services (USCIS). The U.S. Attorney's Office for the Northern District of Texas describes Adeniyi Akeem Somoye as his associate. According to a criminal complaint filed Aug. 31, 2026, the two conspired to receive illegal gratuities by a public official. According to the complaint, from December 2019 through March 2026, Ganiyu used his official position to approve immigration applications, including Forms I-130, I-485, I-751, and N-400, in exchange for money. Investigators allege that he bypassed required interviews, supervisory review, jurisdictional limitations, background checks, and standard USCIS processing protocols to expedite approvals for applicants, many of whom were not eligible under federal law. The complaint alleges that Ganiyu and Somoye together collected hundreds of thousands of dollars in payments from applicants, several of which correspond to approvals issued by Ganiyu. Investigators also identified thousands of WhatsApp messages and hundreds of calls between the two and applicants. Federal agents arrested both men on Sept. 2, 2026, and a federal grand jury returned an indictment on Sept. 23, 2026. The USCIS Office of Investigations, the DHS Office of Inspector General, and the FBI Dallas Field Office investigated.
