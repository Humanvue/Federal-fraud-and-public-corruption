summary: |
  Meliton Cordero, 47, a Supervisory Special Agent with the Drug Enforcement Administration who had been assigned for six years to the U.S. Embassy in the Dominican Republic, was arrested in Washington, D.C., on February 12, 2026, on a criminal complaint in the U.S. District Court for the District of Columbia. The complaint charges conspiracy to commit bribery and visa fraud. According to the charging documents as described by the U.S. Attorney's Office, Cordero accepted thousands of dollars in exchange for assisting foreign nationals in securing nonimmigrant visas for temporary visits to the United States, and in one instance he met a foreign national and provided a passport and visa in exchange for cash. The office states that during his embassy assignment he expedited at least 119 visa applications, at least one of which is alleged to have been fraudulent, and often coached applicants before their interviews with consular officers. The Department of Justice Office of the Inspector General states that from in or around December 2025 and January 2026 he accepted bribes totaling $7,000 in exchange for facilitating the issuance of U.S. visas. The investigation was conducted by Homeland Security Investigations, the State Department's Diplomatic Security Service, the DOJ Office of the Inspector General, and the DEA.
