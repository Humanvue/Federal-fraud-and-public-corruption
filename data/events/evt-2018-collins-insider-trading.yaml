jurisdiction_note: Insider-trading conspiracy and false statements to the FBI; included because the defendant was a sitting member of the House and the false-statements count concerns a federal investigation of his conduct. Co-defendants Cameron Collins and Stephen Zarsky (private persons) are named in the sources but are not recorded as participants.
summary: |
  According to the indictment unsealed on August 8, 2018, Christopher Collins, who represented the 27th District of New York in the U.S. House of Representatives and served on the board of directors of Innate Immunotherapeutics, learned on June 22, 2017 that the company's drug MIS416 had failed a clinical trial and, that evening, passed the nonpublic results to his son, Cameron Collins, who sold shares and tipped others, including Stephen Zarsky, before the public announcement on June 26, 2017. The U.S. Attorney's Office for the Southern District of New York stated that the trades allowed the tippees to avoid over $768,000 in losses, including approximately $570,900 avoided by Cameron Collins. The indictment further alleged that on April 25, 2018 Collins made false statements to FBI agents about his conduct. The plea release states that Collins resigned his seat in Congress on September 30, 2019. The sentencing release states that the court ordered one year of supervised release and a fine of $200,000.
