summary: |
  John H. Windom, 64, a member of the Senior Executive Service who served as Executive Director of the Department of Veterans Affairs' Office of Electronic Health Record Modernization, was named in a three-count indictment returned in the U.S. District Court for the District of Columbia on March 25, 2026. According to the indictment, between August 2017 and June 2021, while leading the VA's electronic health record program (a $10 billion contract awarded in May 2018, with total implementation cost estimated by VA officials at approximately $16 billion), Windom accepted, and in some instances demanded, gifts, meals, entertainment, and other benefits from a group of owners and employees of VA contractors and subcontractors that he referred to as the "Power Group." The indictment alleges that in 2020 he received approximately $8,200 in Louis Vuitton gift cards, $2,000 in cash, a $631 air filter, $1,800 in casino chips, a $1,000 gift card, and $2,000 in cash or casino chips from these individuals; that on March 31, 2021 he filed a public financial disclosure form reporting no reportable gifts; and that he made false statements to federal investigators in 2021 and 2024. The indictment charges concealment of material facts, false statements, and falsification of a record or document. The U.S. Attorney's Office states that the FBI Washington Field Office and the VA Office of Inspector General investigated.
