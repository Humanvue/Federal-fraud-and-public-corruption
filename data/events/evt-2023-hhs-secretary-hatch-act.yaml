summary: |
  The U.S. Office of Special Counsel (OSC) investigated a complaint alleging that Secretary of Health and Human Services Xavier Becerra violated the Hatch Act on September 15, 2022, while speaking in his official capacity at the Congressional Hispanic Caucus Institute Annual Awards Gala. According to the report, Secretary Becerra attended the gala in his official capacity, received an award presented by Senator Alex Padilla, who was then a candidate in a 2022 United States Senate election, and, deviating from prepared remarks that an HHS Ethics Division attorney had reviewed, expressed support for Senator Padilla's reelection. OSC concluded that Secretary Becerra violated the Hatch Act by expressing support for the Senator's reelection while speaking as a government official. The report (OSC File No. HA-22-000223), dated March 16, 2023, was forwarded to the President on April 18, 2023 under 5 U.S.C. § 1215(b), together with Secretary Becerra's response, in which he wrote that he did not intend to use his official authority to affect the result of an election, that he regretted the inadvertent violation, and that he had received additional Hatch Act counseling from the HHS Ethics Division.
