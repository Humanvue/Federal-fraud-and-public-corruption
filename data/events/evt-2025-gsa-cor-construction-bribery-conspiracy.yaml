summary: |
  Lennie Lamont Miller was a contracting officer's representative at the General Services Administration (GSA). According to court documents described by the U.S. Attorney's Office for the District of Maryland, between 2018 and 2021 Miller used his authority over the GSA contracting process to direct federal project work to Company A, a general construction company owned by Christopher Brackins, in exchange for cash, checks, vehicle repairs and repairs at a residence owned by a relative. The office states that Brackins provided Miller approximately $50,000 in money and other things of value, including $8,000 in cash in late 2018 routed through an inflated employee bonus and $25,000 in early 2021 paid through an intermediary's air-conditioning repair business. From early 2020 until at least mid-2021, according to the same documents, Miller funneled work to Company D, owned by James Tillman, in exchange for cash, a sports car and moving expenses for his romantic partner; court documents in Tillman's case put the value of what Tillman provided at approximately $59,800. The GSA Office of Inspector General, the FBI, the Defense Criminal Investigative Service and the Department of Homeland Security Office of Inspector General investigated the case.
