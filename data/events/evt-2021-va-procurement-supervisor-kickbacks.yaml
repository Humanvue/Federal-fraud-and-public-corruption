summary: |
  Thomas E. Duncan was a procurement supervisor in the Central Supply department of the Jesse Brown Veterans Affairs Medical Center in Chicago. According to an indictment returned in the Northern District of Illinois on February 4, 2021, Duncan received approximately $36,250 in kickbacks paid by checks, plus an additional amount in cash, from Daniel Dingle, president of a medical supply company in Dolton, Illinois, and in exchange used his position to initiate and approve purchases from Dingle's company totaling at least $1.7 million, many of which were never delivered to the VA. The checks were made payable to Helping Hands Properties LLC, an entity managed by Duncan, with false memo entries to disguise their purpose. The scheme ran from 2012 until 2019. In late 2018, while the VA Office of Inspector General was investigating, Duncan created fake invoices from Helping Hands and told Dingle to tell investigators that the payments were for work performed by Helping Hands. The U.S. Attorney's Office stated the government's position that the defendants owed restitution of approximately $1,719,219 to the Department of Veterans Affairs; the court ordered Duncan to pay $1,709,344 in restitution. The VA Office of Inspector General investigated the case.
