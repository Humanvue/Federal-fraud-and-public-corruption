# Completeness tiers (owner decision 2026-10-04; SPEC.md §11 Phase 4).
# The site aims to be complete going forward (every in-scope case announced from October 2026 on,
# via the daily queue) and complete for these historical tiers. Each tier's items are listed in
# queue/candidates.yaml with the tag tier:<id>; a tier is complete when none are open.
# Definitions only. Never put names in this file.
tiers:
  - id: congress
    name: "Members of Congress"
    definition: "Every member of the House or Senate charged with a federal crime related to public corruption, campaign or official funds, false statements, or obstruction, or found in violation by the House or Senate Ethics Committee, with the first public action in 2016 or later. Sexual misconduct matters and conduct after leaving Congress are excluded."
    enumerated_from: "House and Senate Ethics Committee reports, public letters, and press releases; Justice Department press releases; congress.gov resolutions."
    enumerated_on: "2026-10-04"
  - id: senior_official
    name: "Senior executive-branch officials"
    definition: "Every cabinet secretary, agency head, other Senate-confirmed appointee, U.S. Attorney, or senior White House official named in a federal criminal charge, an Inspector General finding about their conduct (including findings of no violation), or an Office of Government Ethics finding, with the first public action in 2016 or later."
    enumerated_from: "Inspector General reports and investigative summaries (oversight.gov and agency OIG sites), Office of Government Ethics, Justice Department press releases."
    enumerated_on: null
  - id: hatch_act
    name: "Hatch Act findings"
    definition: "Every Hatch Act violation finding the Office of Special Counsel made public about a named federal official, in a report to the President or an announcement of discipline or settlement, in 2016 or later."
    enumerated_from: "Office of Special Counsel Hatch Act resources and news pages."
    enumerated_on: "2026-10-04"
  - id: pin_report
    name: "Public Integrity Section report cases"
    definition: "Every federal judicial, legislative, or executive branch case described in the Public Integrity Section's annual Reports to Congress for 2016 onward."
    enumerated_from: "Public Integrity Section Reports to Congress for 2016-2023, Part II."
    enumerated_on: "2026-10-04"
